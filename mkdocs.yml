site_name: Návrh a tvorba webových stránok
site_description: Predmet Návrh a tvorba webových stránok pre študentov elektronického obchodu a manažmentu — webdizajn a vibe coding s AI.
site_author: Juraj Fabuš
site_url: https://tvorbawww.fabus.eu/
repo_url: https://github.com/saman1001/navrh-a-tvorba-webstranok
repo_name: navrh-a-tvorba-webstranok
copyright: "© 2026 Návrh a tvorba webových stránok · Žilinská univerzita v Žiline · <a href='#__consent'>Nastavenia cookies</a>"
docs_dir: docs
# false = generuje blok-8.html (nie blok-8/index.html), aby sa HTML dalo otvoriť aj dvojklikom (file://)
use_directory_urls: false

theme:
  name: material
  language: sk
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Prepnúť na tmavý režim
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Prepnúť na svetlý režim
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/copy-lokalne.js

# Google Analytics 4 — načíta sa až po odsúhlasení v cookie lište (extra.consent)
extra:
  analytics:
    provider: google
    property: G-JBCYE5K9PE
  consent:
    title: Súbory cookie
    description: >-
      Tento web používa cookies len na anonymnú štatistiku návštevnosti
      (Google Analytics), aby sme vedeli, ktoré časti predmetu ti pomáhajú.
      Analytika sa zapne až po tvojom súhlase a voľbu môžeš kedykoľvek
      zmeniť cez „Nastavenia cookies" v pätičke.
    actions:
      - accept
      - reject

markdown_extensions:
  - admonition
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

plugins:
  - search
  # Spojená stránka celého webu na print_page.html — slúži na PDF archív semestra (Ctrl+P alebo headless Chrome)
  - print-site:
      add_to_navigation: false
      add_cover_page: true
      enumerate_headings: false
      add_print_site_banner: false

nav:
  - Úvod: index.md
  - "Časť 1 — Webdizajn":
      - Prehľad: 01-webdizajn/index.md
      - "Blok 1 — Cieľ webu": 01-webdizajn/blok-1-ciel-webu.md
      - "Blok 2 — Persóny": 01-webdizajn/blok-2-persony.md
      - "Blok 3 — Informačná architektúra": 01-webdizajn/blok-3-informacna-architektura.md
      - "Blok 4 — Papierový prototyp": 01-webdizajn/blok-4-papierovy-prototyp.md
      - "Blok 5 — Interaktívny prototyp": 01-webdizajn/blok-5-interaktivny-prototyp.md
  - "Časť 2 — Vibe coding":
      - Prehľad: 02-vibe-coding/index.md
      - "Blok 6 — Čo je web a Style guide": 02-vibe-coding/blok-6-co-je-web-a-styleguide.md
      - "Blok 7 — Web stránka (portfólio)": 02-vibe-coding/blok-7-webstranka.md
      - "Blok 8 — Git a oprava chýb": 02-vibe-coding/blok-8-git-a-oprava.md
      - "Blok 9 — API a bezpečnosť": 02-vibe-coding/blok-9-api-a-bezpecnost.md
      - "Blok 10 — Interaktivita a nasadenie": 02-vibe-coding/blok-10-interaktivita-a-nasadenie.md
      - "Blok 11 — Vlastný projekt": 02-vibe-coding/blok-11-vlastny-projekt.md
  - "Záver":
      - "Blok 12 — Referát a prezentácia": 03-zaver/blok-12-referat-a-prezentacia.md
  - "Znalostná báza":
      - "Prostredie (Codespaces)": znalostna-baza/prostredie-codespaces.md
      - "Čo je web": znalostna-baza/co-je-web.md
      - "Prvky webstránky": znalostna-baza/prvky-webstranky.md
      - "Kontrola webu": znalostna-baza/kontrola-webu.md
      - "Prístupnosť webu": znalostna-baza/pristupnost-webu.md
      - "Git — záchranná brzda": znalostna-baza/git-zachranna-brzda.md
      - "Bezpečnosť kľúčov": znalostna-baza/bezpecnost-klucov.md
      - "Nasadenie (GitHub Pages)": znalostna-baza/nasadenie-github-pages.md
